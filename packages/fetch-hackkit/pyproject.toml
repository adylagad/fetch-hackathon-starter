[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fetch-hackkit"
version = "0.1.0"
description = "Batteries for Fetch.ai hackathon agents: chat protocol, ASI:One interactive cards, ASI:One LLM + tools, payments, MCP, and Agentverse registration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["fetch.ai", "uagents", "agentverse", "asi1", "agents", "hackathon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "uagents>=0.26.1,<0.28",
  "uagents-core>=0.4.12",
  "openai>=1.50",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/adylagad/fetch-hackathon-starter"
Documentation = "https://github.com/adylagad/fetch-hackathon-starter/blob/main/AGENTS.md"
Issues = "https://github.com/adylagad/fetch-hackathon-starter/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]

[project.scripts]
hackkit = "fetch_hackkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fetch_hackkit"]
